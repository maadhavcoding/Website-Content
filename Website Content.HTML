<!DOCTYPE html>
<html lang="en">
<head>
    <title>Website  content</title>

    <style>
        body, html {
            margin: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }
        .pimg1, .pimg2, .pimg3 {
            position: relative;
            opacity: 0.70;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .pimg1 {
            background-image: url('download (8).jpeg');
            min-height: 100%;
        }
        .pimg2 {
            background-image: url('download (7).jpeg');
            min-height: 400px;
        }
        .pimg3 {
            background-image: url('download (6).jpeg')
            min-height: 400px;
        }
        .section {
            text-align: center;
            padding: 50px 80px;
        }
        .section-light {
            background-color: #f4f4f4;
            color: #666;
        }
        .section-dark {
            background-color: #282e34;
            color: #ddd;
        }
        .ptext {
            position: absolute;
            top: 50%;
            width: 100%;
            text-align: center;
            color: #000;
            font-size: 27px;
            letter-spacing: 8px;
            text-transform: uppercase;
        }
        .ptext .border {
            background-color: #111;
            color: #fff;
            padding: 20px;
        }
        .ptext .border.trans {
            background-color: transparent;
        }
        .header-text {
            text-align: center;
            font-size: 40px;
            margin: 20px 0;
        }
        @media(max-width:568px){
            .pimg1, .pimg2, .pimg3 {
            background-attachment: scroll;
        }
    }
    </style>
</head>
<body>
    <div class="header-text">
        Welcome all to this website
    </div>
    <div class="pimg1">
        <div class="ptext">
            <span class="border">Image One Text</span>
        </div>
    </div>
    <section class="section section-dark">
        <h2>Section One</h2>
        <p>
            Web development is the work involved in developing a Web site for the Internet (World Wide Web) or an intranet (a private network).
        </p>
    </section>
    <div class="pimg2">
        <div class="ptext">
            <span class="border trans">Image Two Text</span>
        </div>
    </div>
    <div class="pimg3">
        <div class="ptext">
            <span class="border trans">Image Three Text</span>
        </div>
    </div>
</body>
</html>
